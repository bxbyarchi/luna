openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: M-Sklad Restaurant Inventory & ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Auth context
  - name: categories
    description: Item categories
  - name: locations
    description: Warehouse locations
  - name: venue
    description: Fair venue structure — houses and cash registers
  - name: kassa
    description: Cash register operations — shifts, sales, returns, analytics
  - name: items
    description: Inventory items
  - name: receipts
    description: Goods receiving
  - name: write-offs
    description: Write-offs and breakage
  - name: inventory-audits
    description: Inventory audits
  - name: staff
    description: Staff directory
  - name: analytics
    description: Analytics & dashboard
  - name: audit-log
    description: Audit log
  - name: storage
    description: File storage
  - name: rentals
    description: Equipment rental tracking

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info and role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthorized

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List active warehouse locations
      responses:
        "200":
          description: Locations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"

  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /houses:
    get:
      operationId: listHouses
      tags: [venue]
      summary: List fair houses (домики), scoped by warehouse/venue location
      parameters:
        - name: locationId
          in: query
          description: Admin only — filter to a specific venue location.
          schema:
            type: integer
      responses:
        "200":
          description: Houses list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/House"
    post:
      operationId: createHouse
      tags: [venue]
      summary: Create a house (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/House"

  /houses/{id}:
    patch:
      operationId: updateHouse
      tags: [venue]
      summary: Update a house (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/House"
    delete:
      operationId: deleteHouse
      tags: [venue]
      summary: Delete a house (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /registers:
    get:
      operationId: listRegisters
      tags: [venue]
      summary: List cash registers (кассы), scoped by warehouse/venue location
      parameters:
        - name: locationId
          in: query
          description: Admin only — filter to a specific venue location.
          schema:
            type: integer
        - name: houseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Registers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Register"
    post:
      operationId: createRegister
      tags: [venue]
      summary: Create a register (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegisterBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Register"

  /registers/{id}:
    patch:
      operationId: updateRegister
      tags: [venue]
      summary: Update a register (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRegisterBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Register"
    delete:
      operationId: deleteRegister
      tags: [venue]
      summary: Delete a register (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /shifts:
    get:
      operationId: listShifts
      tags: [kassa]
      summary: List cash register shifts, scoped by venue location
      parameters:
        - name: locationId
          in: query
          schema:
            type: integer
        - name: registerId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed]
      responses:
        "200":
          description: Shifts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftListItem"
    post:
      operationId: openShift
      tags: [kassa]
      summary: Open a new shift on a register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenShiftBody"
      responses:
        "201":
          description: Opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"

  /shifts/{id}:
    get:
      operationId: getShift
      tags: [kassa]
      summary: Get a single shift
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"

  /shifts/{id}/close:
    patch:
      operationId: closeShift
      tags: [kassa]
      summary: Close a shift with counted cash (Z-report)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseShiftBody"
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"

  /sales:
    get:
      operationId: listSales
      tags: [kassa]
      summary: List sales, scoped by venue location
      parameters:
        - name: locationId
          in: query
          schema:
            type: integer
        - name: shiftId
          in: query
          schema:
            type: integer
        - name: registerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sales list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaleListItem"
    post:
      operationId: createSale
      tags: [kassa]
      summary: Record a sale within an open shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}:
    get:
      operationId: getSale
      tags: [kassa]
      summary: Get a sale with its line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleDetail"

  /sales/{id}/returns:
    post:
      operationId: createReturn
      tags: [kassa]
      summary: Register a return/refund/defect against a sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReturnBody"
      responses:
        "200":
          description: Return recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResult"

  /kassa-analytics/summary:
    get:
      operationId: getKassaAnalyticsSummary
      tags: [kassa]
      summary: Kassa dashboard summary — revenue, returns, breakdown by venue/house, top items
      parameters:
        - name: locationId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KassaAnalyticsSummary"

  /products:
    get:
      operationId: listProducts
      tags: [venue]
      summary: List sellable products (menu) of a house, grouped for the POS grid
      parameters:
        - name: houseId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [venue]
      summary: Add a product to a house's menu (location_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [venue]
      summary: Update a product (location_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [venue]
      summary: Delete a product (location_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /shifts/{id}/cash-movements:
    get:
      operationId: listCashMovements
      tags: [kassa]
      summary: List инкассация (cash collection/deposit) events for a shift
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cash movements list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashMovement"
    post:
      operationId: createCashMovement
      tags: [kassa]
      summary: Record a mid-shift cash collection or deposit (инкассация)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCashMovementBody"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashMovement"

  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List inventory items
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: belowThreshold
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: locationId
          in: query
          description: Admin only — filter to a specific warehouse. Non-admins are always scoped to their own.
          schema:
            type: integer
      responses:
        "200":
          description: Items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      tags: [items]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get a single item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Delete an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      summary: List receipts (receiving records)
      parameters:
        - name: itemId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Receipts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Record a goods receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReceiptBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"

  /receipts/{id}:
    get:
      operationId: getReceipt
      tags: [receipts]
      summary: Get a receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
    patch:
      operationId: updateReceipt
      tags: [receipts]
      summary: Update a receipt (manager/admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReceiptBody"
      responses:
        "200":
          description: Updated receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "404":
          description: Not found
    delete:
      operationId: deleteReceipt
      tags: [receipts]
      summary: Delete a receipt and reverse stock adjustment (manager/admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /write-offs:
    get:
      operationId: listWriteOffs
      tags: [write-offs]
      summary: List write-offs and breakage records
      parameters:
        - name: itemId
          in: query
          schema:
            type: integer
        - name: staffId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Write-offs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WriteOff"
    post:
      operationId: createWriteOff
      tags: [write-offs]
      summary: Record a write-off or breakage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWriteOffBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteOff"

  /write-offs/{id}:
    get:
      operationId: getWriteOff
      tags: [write-offs]
      summary: Get a write-off
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: WriteOff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteOff"
    patch:
      operationId: updateWriteOff
      tags: [write-offs]
      summary: Update a write-off (manager/admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWriteOffBody"
      responses:
        "200":
          description: Updated write-off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteOff"
        "404":
          description: Not found
    delete:
      operationId: deleteWriteOff
      tags: [write-offs]
      summary: Delete a write-off and reverse stock adjustment (manager/admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inventory-audits:
    get:
      operationId: listInventoryAudits
      tags: [inventory-audits]
      summary: List inventory audits
      responses:
        "200":
          description: Audits list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryAudit"
    post:
      operationId: createInventoryAudit
      tags: [inventory-audits]
      summary: Start a new inventory audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryAuditBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAudit"

  /inventory-audits/{id}:
    get:
      operationId: getInventoryAudit
      tags: [inventory-audits]
      summary: Get an inventory audit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAudit"
    patch:
      operationId: updateInventoryAudit
      tags: [inventory-audits]
      summary: Update audit items (submit counts)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryAuditBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAudit"

  /inventory-audits/{id}/submit:
    post:
      operationId: submitInventoryAudit
      tags: [inventory-audits]
      summary: Submit (finalize) an inventory audit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAudit"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff members
      parameters:
        - name: locationId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffMemberBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /staff/{id}:
    patch:
      operationId: updateStaffMember
      tags: [staff]
      summary: Update a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffMemberBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    delete:
      operationId: deleteStaffMember
      tags: [staff]
      summary: Delete a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/category-breakdown:
    get:
      operationId: getAnalyticsCategoryBreakdown
      tags: [analytics]
      summary: Category breakdown by value
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdownItem"

  /analytics/spending-over-time:
    get:
      operationId: getAnalyticsSpendingOverTime
      tags: [analytics]
      summary: Spending over time (receipts vs write-offs)
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
      responses:
        "200":
          description: Time series data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpendingDataPoint"

  /analytics/top-write-offs:
    get:
      operationId: getAnalyticsTopWriteOffs
      tags: [analytics]
      summary: Top items by write-off frequency
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top write-offs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopWriteOffItem"

  /analytics/low-stock:
    get:
      operationId: getAnalyticsLowStock
      tags: [analytics]
      summary: Items at or below minimum threshold
      responses:
        "200":
          description: Low stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit-log]
      summary: List audit log entries (admin/manager only)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  /export/stock:
    get:
      operationId: exportStock
      tags: [analytics]
      summary: Export current stock as Excel file
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /export/write-offs:
    get:
      operationId: exportWriteOffs
      tags: [analytics]
      summary: Export write-off report as Excel file
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /export/kassa:
    get:
      operationId: exportKassa
      tags: [kassa]
      summary: Export shifts and sales report as Excel file
      parameters:
        - name: locationId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /admin/seed-demo-data:
    post:
      operationId: seedDemoData
      tags: [kassa]
      summary: Admin only — populate houses/registers/shifts/sales/warehouse items with demo data for review. Idempotent per house/register (skips ones that already have data).
      responses:
        "200":
          description: Seed summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  summary:
                    type: object
                    additionalProperties:
                      type: integer

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /rentals:
    get:
      operationId: listRentals
      tags: [rentals]
      summary: List all rentals
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, returned]
      responses:
        "200":
          description: Rentals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rental"
    post:
      operationId: createRental
      tags: [rentals]
      summary: Create a rental (decreases stock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRentalBody"
      responses:
        "201":
          description: Created rental
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"

  /rentals/{id}:
    get:
      operationId: getRental
      tags: [rentals]
      summary: Get rental by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rental
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"
        "404":
          description: Not found
    patch:
      operationId: updateRental
      tags: [rentals]
      summary: Update rental (e.g. mark returned)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRentalBody"
      responses:
        "200":
          description: Updated rental
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rental"

  /analytics/active-rentals:
    get:
      operationId: getAnalyticsActiveRentals
      tags: [analytics]
      summary: Items currently out on rental
      responses:
        "200":
          description: Active rentals summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveRentalItem"

components:
