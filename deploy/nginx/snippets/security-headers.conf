# Общие security-заголовки для всех сайтов на этом сервере.
# Подключается через `include snippets/security-headers.conf;` в каждом
# site-конфиге. Приложение (helmet) уже ставит большинство из них само —
# это защита "на всякий случай" на уровне веб-сервера, не зависящая от кода
# конкретного приложения.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-XSS-Protection "0" always;

# Сервер не должен рекламировать свою версию в заголовках/страницах ошибок.
server_tokens off;
