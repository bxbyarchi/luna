# Общие настройки gzip. Подключается через `include snippets/gzip.conf;`
# в http-блоке (nginx.conf), не в отдельных server-блоках — gzip_types и
# gzip on должны быть заданы один раз на уровне http.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/xml
  application/json
  application/javascript
  application/xml
  image/svg+xml;
