services:
  - type: web
    name: luna
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm --filter @workspace/api-server start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: luna-db
          property: connectionString
      - key: NODE_ENV
        value: production
